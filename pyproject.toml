[project]
name = "diffusion-bench"
version = "0.1.0"
description = "A bench for learning about prompt engineering when using text-to-image and image-to-image diffusion models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.6.0",
    "controlnet-aux>=0.0.9",
    "diffusers",
    "imageio[ffmpeg]>=2.34.0",
    "invisible-watermark>=0.2.0",
    "ipykernel>=6.29.5",
    "ipyplot>=1.1.2",
    "mediapipe>=0.10.21",
    "pillow>=12.2.0",       # security: OOB write / decompression-bomb / overflow fixes
    "requests>=2.33.0",     # security: netrc credential leak / temp-file reuse fixes
    "safetensors>=0.5.3",
    "scipy>=1.15.2",
    "sentencepiece>=0.2.1", # security: heap overflow fix
    "spandrel>=0.4.2",
    "torch>=2.8.0",         # security: improper resource shutdown fix
    # security: ReDoS fixes land in 4.53. Held <5 to avoid the breaking
    # transformers-5/huggingface-hub-1 migration; the two RCE advisories that
    # need 5.x require loading untrusted models and are tracked separately.
    "transformers>=4.57.0,<5",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
